description: Not found error
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: integer
          example: 404
        message:
          type: string
          example: Not found error
        data:
          type: object
          required:
            - message
          properties:
            message:
              type: string
              example: 'Contact with id=67f2b327707ced5515ecff01 not found'
