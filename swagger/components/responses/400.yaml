description: Bad request error
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: integer
          example: 400
        message:
          type: string
          example: Bad request error
        data:
          type: object
          required:
            - message
          properties:
            message:
              type: string
              example: '67f2b327707ced5515ecff0e1 not valid id or not valid body'
